<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">loregraph</title>
  <desc id="desc">Deterministic, layered code knowledge graph for any JS/TS repo, with an MCP server for agents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="18%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="82%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#halo)"/>

  <g opacity="0.85">
    <line x1="64" y1="96" x2="148" y2="58" stroke="#26364F" stroke-width="1.5"/>
