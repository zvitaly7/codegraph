    <circle cx="1094" cy="244" r="7" fill="#FB923C" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="1184" cy="312" r="6" fill="#60A5FA" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="1128" cy="366" r="4" fill="#2DD4BF" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="1034" cy="122" r="4" fill="#60A5FA" stroke="#0A0F1C" stroke-width="2"/>
  </g>

  <!-- mark: three files resolving into one graph node -->
  <g transform="translate(640 96)">
    <line x1="-46" y1="14" x2="0" y2="-22" stroke="#26364F" stroke-width="2.5"/>
    <line x1="46" y1="14" x2="0" y2="-22" stroke="#26364F" stroke-width="2.5"/>
    <line x1="-46" y1="14" x2="46" y2="14" stroke="#26364F" stroke-width="2.5" stroke-dasharray="4 5"/>
    <circle cx="0" cy="-22" r="13" fill="#60A5FA"/>
    <circle cx="-46" cy="14" r="10" fill="#C084FC"/>
    <circle cx="46" cy="14" r="10" fill="#2DD4BF"/>
  </g>

  <g font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="226" font-size="104" font-weight="700" letter-spacing="-3" fill="#F1F6FC">loregraph</text>
    <text x="640" y="278" font-size="25" font-weight="500" fill="#9BB0C9">Deterministic, layered code knowledge graph for any JS/TS repo</text>
    <text x="640" y="342" font-size="17" font-weight="600" letter-spacing="3.2" fill="#7C93AE">INVENTORY · IMPORTS · SYMBOLS · REFERENCES · USAGES · DOMAINS · MCP</text>
  </g>

  <rect x="480" y="300" width="320" height="3" rx="1.5" fill="url(#rule)"/>
