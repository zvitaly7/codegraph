    <line x1="152" y1="152" x2="186" y2="244" stroke="#26364F" stroke-width="1.5"/>
    <line x1="58" y1="214" x2="96" y2="312" stroke="#26364F" stroke-width="1.5"/>
    <line x1="186" y1="244" x2="152" y2="366" stroke="#26364F" stroke-width="1.5"/>
    <line x1="96" y1="312" x2="152" y2="366" stroke="#26364F" stroke-width="1.5"/>
    <line x1="148" y1="58" x2="246" y2="122" stroke="#26364F" stroke-width="1.5"/>
    <line x1="152" y1="152" x2="246" y2="122" stroke="#26364F" stroke-width="1.5"/>
    <circle cx="64" cy="96" r="7" fill="#60A5FA" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="148" cy="58" r="5" fill="#2DD4BF" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="152" cy="152" r="9" fill="#C084FC" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="58" cy="214" r="5" fill="#4ADE80" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="186" cy="244" r="7" fill="#FB923C" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="96" cy="312" r="6" fill="#60A5FA" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="152" cy="366" r="4" fill="#2DD4BF" stroke="#0A0F1C" stroke-width="2"/>
    <circle cx="246" cy="122" r="4" fill="#60A5FA" stroke="#0A0F1C" stroke-width="2"/>
